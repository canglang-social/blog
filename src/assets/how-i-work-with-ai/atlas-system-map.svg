<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 980" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="System map: twelve workflow nodes grouped by home, connected by feed arrows, enclosed in the chief-of-staff audit perimeter, with the Logseq vault as a sink band at the bottom.">
  <style>
    svg { --ink:#1e1c17; --ink2:#5b5850; --muted:#8b877c; --card:#f7f5ef; --line:#c9c5b8; --edge:#a49f92;
          --agentkit:#2a78d6; --forge:#1baf7a; --jobhunt:#eda100; --vault:#008300; --blog:#4a3aa7;
          --chief:#e34948; --chief-t:#b52f2e; --vaultbg:#eef3e9; }
    @media (prefers-color-scheme: dark) {
      svg { --ink:#f0eee5; --ink2:#b8b4a7; --muted:#8b877c; --card:#191917; --line:#3a3933; --edge:#6d6a60;
            --agentkit:#3987e5; --forge:#199e70; --jobhunt:#c98500; --vault:#4d9c3a; --blog:#9085e9;
            --chief:#e66767; --chief-t:#e66767; --vaultbg:#1c211a; }
    }
    .card { fill:var(--card); stroke:var(--line); }
    .ghost { fill:none; stroke:var(--line); stroke-dasharray:5 4; }
    .nn { fill:var(--ink); font-family:Charter, 'Iowan Old Style', Georgia, serif; font-weight:700; font-size:13px; }
    .nh { font-size:9.5px; letter-spacing:.4px; }
    .nd { fill:var(--ink2); font-size:10px; }
    .lbl { fill:var(--ink2); font-size:10px; }
    .lblm { fill:var(--muted); font-size:10px; }
    .edge { fill:none; stroke:var(--edge); stroke-width:1.4; }
    .edged { fill:none; stroke:var(--edge); stroke-width:1.3; stroke-dasharray:4 4; }
    .vedge { fill:none; stroke:var(--vault); stroke-width:1.4; }
    .leg { fill:var(--ink2); font-size:10px; }
  </style>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--edge)" stroke-width="1.6"/>
    </marker>
    <marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--vault)" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- audit perimeter -->
  <rect x="20" y="60" width="1040" height="830" rx="6" fill="none" stroke="var(--chief)" stroke-width="1.3" stroke-dasharray="7 5"/>
  <text x="1046" y="84" font-size="10" fill="var(--chief-t)" text-anchor="end">every node inside is a row in inventory.yaml</text>

  <!-- edges (under the cards) -->
  <line x1="150" y1="286" x2="150" y2="326" class="edge" marker-end="url(#ma)"/>
  <text x="160" y="312" class="lbl">prompts power the deployments</text>

  <path d="M 256,366 C 400,300 520,170 786,230" class="edge" marker-end="url(#ma)"/>
  <text x="430" y="188" class="lbl">career facts — via master.md only</text>

  <path d="M 256,500 C 560,510 720,330 788,256" class="edge" marker-end="url(#ma)"/>
  <text x="400" y="490" class="lbl">vocabulary for interviews / JDs</text>

  <path d="M 648,300 C 710,290 740,262 786,246" class="edge" marker-end="url(#ma)"/>
  <text x="652" y="320" class="lbl">reviewed projects → case studies</text>

  <line x1="894" y1="288" x2="894" y2="366" class="edge" marker-end="url(#ma)"/>
  <text x="904" y="332" class="lbl">base resumes</text>

  <path d="M 786,430 C 720,444 690,412 654,380" class="edged" marker-end="url(#ma)"/>
  <text x="636" y="450" class="lblm">demand signal → /ideate</text>

  <path d="M 998,252 C 1040,330 1040,480 1000,556" class="edge" marker-end="url(#ma)"/>
  <text x="1014" y="516" class="lbl" text-anchor="end">case-study copy → site</text>

  <path d="M 256,522 C 520,606 660,600 784,578" class="edged" marker-end="url(#ma)"/>
  <text x="500" y="618" class="lblm">learn-in-public drafts</text>

  <path d="M 152,540 C 168,630 240,724 326,760" class="vedge" marker-end="url(#mv)"/>
  <text x="176" y="584" font-size="10" fill="var(--vault)">retrieval tail → journal + cards</text>

  <path d="M 256,656 C 292,692 310,722 328,748" class="vedge" marker-end="url(#mv)"/>

  <line x1="890" y1="626" x2="890" y2="694" class="edge" marker-end="url(#ma)"/>
  <text x="900" y="664" class="lbl">posts → distribution</text>

  <path d="M 996,738 C 1058,660 1058,510 998,446" class="edge" marker-end="url(#ma)"/>
  <text x="1010" y="494" class="lbl" text-anchor="end">recruiter-facing surface (LinkedIn)</text>

  <path d="M 256,396 C 300,540 302,700 344,858 C 500,886 720,878 868,798" class="edged" marker-end="url(#ma)"/>
  <text x="470" y="876" class="lblm">profile facts ground the persona — never invent</text>

  <!-- workflow-audit (meta, on the perimeter) -->
  <g>
    <rect x="428" y="22" width="230" height="94" rx="2" fill="var(--card)" stroke="var(--chief)" stroke-width="1.5"/>
    <text x="440" y="42" class="nn">workflow-audit <tspan fill="var(--chief-t)">· meta</tspan></text>
    <text x="440" y="57" class="nh" fill="var(--chief-t)">ai-chief-of-staff</text>
    <text x="440" y="74" class="nd">inventory → checks → /audit →</text>
    <text x="440" y="87" class="nd">proposals → Felix confirms →</text>
    <text x="440" y="100" class="nd">draft PR</text>
  </g>

  <!-- file-management (ghost, wanted) -->
  <g>
    <rect x="48" y="96" width="190" height="76" rx="2" class="ghost"/>
    <text x="60" y="116" class="nn" fill="var(--ink2)">file-management</text>
    <text x="60" y="131" class="nh" fill="var(--muted)">no home yet · wanted</text>
    <text x="60" y="148" class="nd">WHERE files live — Drive ·</text>
    <text x="60" y="161" class="nd">GitHub · volumes</text>
  </g>

  <!-- agent-kit column -->
  <g>
    <rect x="48" y="206" width="204" height="80" rx="2" class="card"/>
    <text x="60" y="226" class="nn">prompt-lifecycle</text>
    <text x="60" y="241" class="nh" fill="var(--agentkit)">agent-kit</text>
    <text x="60" y="258" class="nd">idea → prompts/ library →</text>
    <text x="60" y="271" class="nd">thin loaders</text>
  </g>
  <g>
    <rect x="48" y="330" width="204" height="80" rx="2" class="card"/>
    <text x="60" y="350" class="nn">profile-loop</text>
    <text x="60" y="365" class="nh" fill="var(--agentkit)">agent-kit</text>
    <text x="60" y="382" class="nd">interview → master-profile →</text>
    <text x="60" y="395" class="nd">CC snippet + Drive mirror</text>
  </g>
  <g>
    <rect x="48" y="452" width="204" height="80" rx="2" class="card"/>
    <text x="60" y="472" class="nn">learning-loop</text>
    <text x="60" y="487" class="nh" fill="var(--agentkit)">agent-kit</text>
    <text x="60" y="504" class="nd">#inbox → triage → routes A–D</text>
    <text x="60" y="517" class="nd">→ recall · cards · journal</text>
  </g>
  <g>
    <rect x="48" y="592" width="204" height="80" rx="2" class="card"/>
    <text x="60" y="612" class="nn">daily-review</text>
    <text x="60" y="627" class="nh" fill="var(--agentkit)">agent-kit · Felix-run in Cowork</text>
    <text x="60" y="644" class="nd">evening review + task</text>
    <text x="60" y="657" class="nd">triage (Phase 1b)</text>
  </g>

  <!-- forge center -->
  <g>
    <rect x="428" y="268" width="220" height="132" rx="2" class="card"/>
    <text x="440" y="288" class="nn">project-loop</text>
    <text x="440" y="303" class="nh" fill="var(--forge)">forge</text>
    <text x="440" y="320" class="nd">/ideate → /register → /review</text>
    <text x="440" y="333" class="nd">→ reuse tiers → /new-project ↺</text>
    <line x1="440" y1="346" x2="636" y2="346" stroke="var(--line)" stroke-dasharray="2 3"/>
    <text x="440" y="363" class="nd">outputs: ragx · ragr · logx ·</text>
    <text x="440" y="376" class="nd">learn-to-ship</text>
  </g>

  <!-- job_hunting column -->
  <g>
    <rect x="790" y="206" width="204" height="80" rx="2" class="card"/>
    <text x="802" y="226" class="nn">career-loop</text>
    <text x="802" y="241" class="nh" fill="var(--jobhunt)">job_hunting</text>
    <text x="802" y="258" class="nd">case studies → master.md →</text>
    <text x="802" y="271" class="nd">base resumes</text>
  </g>
  <g>
    <rect x="790" y="370" width="204" height="92" rx="2" class="card"/>
    <text x="802" y="390" class="nn">job-pipeline</text>
    <text x="802" y="405" class="nh" fill="var(--jobhunt)">job_hunting</text>
    <text x="802" y="422" class="nd">/scout → /match → /tailor</text>
    <text x="802" y="435" class="nd">→ /interview ·</text>
    <text x="802" y="448" class="nd">daily/weekly cadence</text>
  </g>

  <!-- publishing-loop — running: its first output embeds this map -->
  <g>
    <rect x="790" y="534" width="204" height="92" rx="2" class="card"/>
    <text x="802" y="554" class="nn">publishing-loop</text>
    <text x="802" y="569" class="nh" fill="var(--blog)">blog · the Editor</text>
    <text x="802" y="586" class="nd">/draft → /refine → /publish</text>
    <text x="802" y="599" class="nd">→ curate /writing</text>
    <text x="802" y="612" class="nd" fill="var(--muted)">first output: this atlas + post</text>
  </g>

  <!-- personal-brand (wanted, designed) -->
  <g>
    <rect x="790" y="698" width="204" height="92" rx="2" class="ghost"/>
    <text x="802" y="718" class="nn" fill="var(--ink2)">personal-brand</text>
    <text x="802" y="733" class="nh" fill="var(--muted)">the Brand Coach · staged</text>
    <text x="802" y="750" class="nd">BUILD → PRESENT → AUDIT ↺</text>
    <text x="802" y="763" class="nd">image · platforms · outside-in</text>
  </g>

  <!-- vault band -->
  <g>
    <rect x="330" y="740" width="430" height="104" rx="2" fill="var(--vaultbg)" stroke="var(--vault)"/>
    <text x="344" y="762" class="nn">The vault — a sink <tspan font-weight="400" fill="var(--ink2)">(Logseq)</tspan></text>
    <text x="344" y="777" class="nh" fill="var(--vault)">wiki-management · the Librarian</text>
    <text x="344" y="795" class="nd">journals/ · pages/ · [[Tasks]] · #card SRS</text>
    <text x="344" y="808" class="nd">producer loops own the content they append;</text>
    <text x="344" y="821" class="nd">the Librarian owns the conventions</text>
  </g>

  <!-- legend -->
  <g>
    <circle cx="36" cy="926" r="4" fill="var(--agentkit)"/><text x="46" y="930" class="leg">agent-kit</text>
    <circle cx="136" cy="926" r="4" fill="var(--forge)"/><text x="146" y="930" class="leg">forge</text>
    <circle cx="216" cy="926" r="4" fill="var(--jobhunt)"/><text x="226" y="930" class="leg">job_hunting</text>
    <circle cx="326" cy="926" r="4" fill="var(--vault)"/><text x="336" y="930" class="leg">vault</text>
    <circle cx="406" cy="926" r="4" fill="var(--blog)"/><text x="416" y="930" class="leg">blog</text>
    <circle cx="476" cy="926" r="4" fill="var(--chief)"/><text x="486" y="930" class="leg">ai-chief-of-staff</text>
    <line x1="620" y1="926" x2="650" y2="926" class="edge"/><text x="656" y="930" class="leg">feeds</text>
    <line x1="720" y1="926" x2="750" y2="926" class="edged"/><text x="756" y="930" class="leg">read-only</text>
    <line x1="844" y1="926" x2="874" y2="926" stroke="var(--chief)" stroke-width="1.4" stroke-dasharray="6 4"/><text x="880" y="930" class="leg">audit perimeter</text>
    <text x="36" y="954" class="leg" fill="var(--muted)">solid card = running · dashed card = wanted</text>
  </g>
</svg>
