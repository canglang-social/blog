<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">How I work with AI — three layers</title>
  <desc id="hero-desc">A decision layer (the Chief of Staff) audits an operation layer (two repos, three roles, and the About-me interview), which reads and writes a data layer (vault, projects, career facts, blog, profile). The full map lives at /atlas.</desc>
  <style>
    svg { --paper:#f7f5ef; --card:#fbfaf6; --ink:#1e1c17; --ink2:#5b5850; --muted:#8b877c;
          --line:#c9c5b8; --edge:#a49f92; --chief:#e34948; --chief-t:#b52f2e;
          --agentkit:#2a78d6; --forge:#1baf7a; --vault:#008300; }
    @media (prefers-color-scheme: dark) {
      svg { --paper:#121210; --card:#191917; --ink:#f0eee5; --ink2:#b8b4a7; --muted:#8b877c;
            --line:#3a3933; --edge:#6d6a60; --chief:#e66767; --chief-t:#e66767;
            --agentkit:#3987e5; --forge:#199e70; --vault:#4d9c3a; }
    }
    .serif { font-family:Charter, 'Iowan Old Style', Georgia, serif; }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1.3; }
    .chip { fill:none; stroke:var(--line); stroke-width:1.1; }
    .name { fill:var(--ink); font-weight:700; font-size:21px; }
    .desc { fill:var(--ink2); font-size:13px; }
    .chiptext { fill:var(--ink); font-size:14px; }
    .lbl { font-size:12px; }
  </style>
  <defs>
    <marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--chief)" stroke-width="1.6"/>
    </marker>
    <marker id="me" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--edge)" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="var(--paper)"/>

  <text class="serif" x="56" y="74" font-size="34" font-weight="700" fill="var(--ink)">How I work with AI</text>
  <text x="56" y="102" font-size="15" fill="var(--ink2)">too many kinds of work, one system — three layers</text>

  <!-- Decision -->
  <g>
    <rect class="card" x="56" y="126" width="1088" height="128" rx="2"/>
    <rect x="56" y="126" width="4" height="128" fill="var(--chief)"/>
    <text class="serif name" x="88" y="166">Decision</text>
    <text class="desc" x="212" y="166">the Chief of Staff — “if it isn’t inventoried, it doesn’t exist”</text>
    <rect class="chip" x="88" y="188" width="144" height="34" rx="2"/>
    <text class="chiptext" x="101" y="210">inventory.yaml</text>
    <rect class="chip" x="246" y="188" width="144" height="34" rx="2"/>
    <text class="chiptext" x="259" y="210">checker script</text>
    <rect class="chip" x="404" y="188" width="295" height="34" rx="2"/>
    <text class="chiptext" x="417" y="210">keep · merge · automate · retire</text>
  </g>

  <!-- audits -->
  <line x1="1080" y1="254" x2="1080" y2="292" stroke="var(--chief)" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#mc)"/>
  <text class="lbl" x="1064" y="278" fill="var(--chief-t)" text-anchor="end">audits</text>

  <!-- Operation -->
  <g>
    <rect class="card" x="56" y="296" width="1088" height="128" rx="2"/>
    <rect x="56" y="296" width="4" height="128" fill="var(--agentkit)"/>
    <text class="serif name" x="88" y="336">Operation</text>
    <text class="desc" x="232" y="336">where the work happens — two repos, three roles, one standing interview</text>
    <rect class="chip" x="88" y="358" width="160" height="34" rx="2"/>
    <text class="chiptext" x="101" y="380"><tspan fill="var(--forge)" font-weight="600">forge</tspan> — projects</text>
    <rect class="chip" x="262" y="358" width="169" height="34" rx="2"/>
    <text class="chiptext" x="275" y="380"><tspan fill="var(--agentkit)" font-weight="600">agent-kit</tspan> — reuse</text>
    <rect class="chip" x="445" y="358" width="76" height="34" rx="2"/>
    <text class="serif chiptext" x="458" y="380" font-weight="700" font-size="15">Editor</text>
    <rect class="chip" x="535" y="358" width="102" height="34" rx="2"/>
    <text class="serif chiptext" x="548" y="380" font-weight="700" font-size="15">Librarian</text>
    <rect class="chip" x="651" y="358" width="126" height="34" rx="2"/>
    <text class="serif chiptext" x="664" y="380" font-weight="700" font-size="15">Brand Coach</text>
    <rect class="chip" x="791" y="358" width="169" height="34" rx="2"/>
    <text class="chiptext" x="804" y="380">About me (Cowork)</text>
  </g>

  <!-- reads / writes -->
  <line x1="1080" y1="424" x2="1080" y2="462" stroke="var(--edge)" stroke-width="1.3" marker-start="url(#me)" marker-end="url(#me)"/>
  <text class="lbl" x="1064" y="448" fill="var(--muted)" text-anchor="end">reads · writes</text>

  <!-- Data -->
  <g>
    <rect class="card" x="56" y="466" width="1088" height="128" rx="2"/>
    <rect x="56" y="466" width="4" height="128" fill="var(--vault)"/>
    <text class="serif name" x="88" y="506">Data</text>
    <text class="desc" x="160" y="506">what everything reads and writes — the facts, kept where a session can find them</text>
    <rect class="chip" x="88" y="528" width="127" height="34" rx="2"/>
    <text class="chiptext" x="101" y="550">Logseq vault</text>
    <rect class="chip" x="229" y="528" width="160" height="34" rx="2"/>
    <text class="chiptext" x="242" y="550">project registry</text>
    <rect class="chip" x="403" y="528" width="228" height="34" rx="2"/>
    <text class="chiptext" x="416" y="550">master.md (career facts)</text>
    <rect class="chip" x="645" y="528" width="110" height="34" rx="2"/>
    <text class="chiptext" x="658" y="550">blog posts</text>
    <rect class="chip" x="769" y="528" width="144" height="34" rx="2"/>
    <text class="chiptext" x="782" y="550">master profile</text>
  </g>

  <text class="lbl" x="1144" y="618" fill="var(--muted)" text-anchor="end">the full map lives at /atlas</text>
</svg>
