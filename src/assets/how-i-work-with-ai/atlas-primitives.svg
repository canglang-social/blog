<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 290" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="Anatomy of the five primitives: a prompt is deployed by a command, which wears a role, all inside a workflow loop that produces a project.">
  <style>
    svg { --ink:#1e1c17; --ink2:#5b5850; --muted:#8b877c; --card:#f7f5ef; --line:#c9c5b8; --edge:#a49f92; }
    @media (prefers-color-scheme: dark) {
      svg { --ink:#f0eee5; --ink2:#b8b4a7; --muted:#8b877c; --card:#191917; --line:#3a3933; --edge:#6d6a60; }
    }
    .t  { fill:var(--ink); font-weight:700; font-size:12px; }
    .d  { fill:var(--ink2); font-size:10px; }
    .m  { fill:var(--muted); font-size:10px; }
    .lbl{ fill:var(--ink2); font-size:9px; text-anchor:middle; }
    .box{ fill:var(--card); stroke:var(--line); }
    .frame{ fill:none; stroke:var(--ink2); stroke-width:1.4; }
    .edge{ fill:none; stroke:var(--edge); stroke-width:1.4; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--edge)" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="18" y="52" width="650" height="196" rx="4" class="frame"/>
  <text x="34" y="80" font-size="13" font-weight="700" fill="var(--ink)">WORKFLOW</text>
  <text x="34" y="97" class="d" font-size="10.5">the recurring loop — the unit the inventory tracks</text>
  <text x="34" y="230" class="m">e.g. project-loop · learning-loop · workflow-audit</text>

  <rect x="46" y="122" width="146" height="70" rx="2" class="box"/>
  <text x="60" y="146" class="t">PROMPT</text>
  <text x="60" y="163" class="d">stored text · asset</text>
  <text x="60" y="178" class="m">agent-kit prompts/*</text>

  <rect x="268" y="122" width="146" height="70" rx="2" class="box"/>
  <text x="282" y="146" class="t">COMMAND</text>
  <text x="282" y="163" class="d">loader · fixed steps</text>
  <text x="282" y="178" class="m">/audit · /review</text>

  <rect x="482" y="122" width="168" height="70" rx="2" class="box"/>
  <text x="496" y="146" class="t">ROLE</text>
  <text x="496" y="163" class="d">judgment + bounds</text>
  <text x="496" y="178" class="m" font-size="9.5">the four judgment-roles</text>

  <line x1="192" y1="157" x2="264" y2="157" class="edge" marker-end="url(#ah)"/>
  <text x="228" y="147" class="lbl">deployed by</text>
  <line x1="414" y1="157" x2="478" y2="157" class="edge" marker-end="url(#ah)"/>
  <text x="446" y="147" class="lbl">wears</text>

  <line x1="668" y1="150" x2="756" y2="150" class="edge" marker-end="url(#ah)"/>
  <text x="712" y="141" class="lbl">produces</text>

  <rect x="760" y="115" width="170" height="70" rx="2" fill="var(--card)" stroke="var(--ink2)" stroke-width="1.4"/>
  <text x="774" y="139" class="t">PROJECT</text>
  <text x="774" y="156" class="d">a built thing · output</text>
  <text x="770" y="171" class="m" font-size="9.5">ragx · logx · learn-to-ship</text>

  <path d="M 343,52 C 343,26 343,26 370,26 L 560,26 C 590,26 590,26 590,52" class="edge" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#ah)"/>
  <text x="466" y="20" class="lbl" fill="var(--muted)">…and loops again</text>
</svg>
