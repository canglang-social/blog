<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title"><title id="title">侧栏分组与任务实际文件夹</title><rect width="1000" height="400" fill="#f5f8fc"/><g font-family="Avenir Next, PingFang SC, sans-serif"><text x="32" y="44" fill="#15324f" font-size="26" font-weight="600">Codex：侧栏位置 ≠ 工作文件夹</text><path d="M32 83h160l18 18h204v203H32z" fill="#e8eef7"/><text x="54" y="141" fill="#15324f" font-size="23" font-weight="600">AI 服务业务分组</text><text x="54" y="174" fill="#546b80" font-size="18" font-weight="400">侧栏里看到的位置</text><rect x="54" y="204" width="336" height="67" rx="7" fill="white"/><text x="72" y="245" fill="#15324f" font-size="24" font-weight="600">Share GitHub project</text><path d="M422 236h155m-10-7 10 7-10 7" fill="none" stroke="#546b80" stroke-width="2"/><text x="433" y="194" fill="#546b80" font-size="18" font-weight="400">记录中的文件夹</text><rect x="594" y="102" width="374" height="202" rx="7" fill="#fff0f0"/><text x="616" y="143" fill="#15324f" font-size="20" font-weight="400">任务当时使用的文件夹</text><text x="616" y="210" fill="#a83c44" font-size="29" font-weight="600">ai-chief-of-staff</text><text x="616" y="251" fill="#15324f" font-size="21" font-weight="400">个人 AI 工作流程项目</text><text x="32" y="350" fill="#087c72" font-size="24" font-weight="600">原本想用的项目：ai-services-business</text><text x="32" y="383" fill="#546b80" font-size="19" font-weight="400">连线表示记录中的关联，不表示任务在项目之间移动。</text></g></svg>